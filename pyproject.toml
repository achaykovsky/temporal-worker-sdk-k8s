[tool.poetry]
name = "temporal-worker-sdk-k8s"
version = "0.1.0"
description = "Reusable Temporal worker bootstrap and config for the calculator reference stack."
readme = "README.md"
authors = []
packages = [
    { include = "temporal_worker_sdk", from = "src" },
    { include = "calculator", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
temporalio = ">=1.7.0,<2"
prometheus-client = "^0.24.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.8"
mypy = "^1.13"
pip-audit = "^2.7"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*", "scripts.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits real Temporal (excluded from default CI)",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
